name: integration-tests
run-name: ${{ github.event.head_commit.message }} - PR integration test
permissions:
  contents: write
on:
  pull_request:
    branches:
      - main
jobs:
  codespaces-integration-test-with-dynatrace-deployment:
    runs-on: ubuntu-24.04
    # Platform + Ollama model pull + agents: ~10 min on a 4-core runner.
    timeout-minutes: 30
    env:
      # GitHub runners for private repos have 2 vCPU: CI skips Tetragon and the
      # in-cluster LLM (see aiwCiLite in my_functions.sh).
      AIW_CI_LITE: "true"
      DT_ENVIRONMENT: ${{ secrets.DT_ENVIRONMENT }}
      DT_OPERATOR_TOKEN: ${{ secrets.DT_OPERATOR_TOKEN }}
      DT_INGEST_TOKEN: ${{ secrets.DT_INGEST_TOKEN }}
    steps:
      - name: Commit info
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Repository ${{ github.repository }}"
          echo "Commit message ${{ github.event.head_commit.message }}" 
          echo "Event ${{ github.event_name }}"
          echo "envs" && env
      - name: Free runner disk (the stack pulls ~20 GiB of images + model)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Add secrets in .env file for running locally with VS Code extension
        run: |
            cd .devcontainer 
            cat <<EOF >> .env
            DT_ENVIRONMENT=$DT_ENVIRONMENT
            DT_OPERATOR_TOKEN=$DT_OPERATOR_TOKEN
            DT_INGEST_TOKEN=$DT_INGEST_TOKEN
            AIW_CI_LITE=$AIW_CI_LITE
            EOF
            sed -i '/"runArgs": \["--init", "--privileged", "--network=host"\]/c\  "runArgs": ["--init", "--privileged", "--network=host", "--env-file",".devcontainer/.env"]' devcontainer.json
      - name: Test Codespace (devcontainer) build and run commands
        timeout-minutes: 25
        uses: devcontainers/ci@v0.3
        with:
          imageName: shinojosa/dt-enablement
          cacheFrom: shinojosa/dt-enablement
          push: never
          runCmd: |
            zsh .devcontainer/test/integration.sh
      - name: Cluster state (diagnostics)
        if: always()
        run: |
          df -h /
          free -m
          docker ps --format '{{.Names}} {{.Status}}'
          N=$(docker ps --format '{{.Names}}' | grep -m1 'server-0' || true)
          [ -n "$N" ] || exit 0
          docker exec "$N" kubectl get pods -A -o wide | grep -vE 'Running|Completed' || true
          docker exec "$N" kubectl describe node | grep -A10 -E '^Conditions|^Allocated' || true
          docker exec "$N" kubectl get pods -A -o custom-columns='NS:.metadata.namespace,POD:.metadata.name,CPU:.spec.containers[*].resources.requests.cpu' || true
          docker exec "$N" kubectl get events -A --sort-by=.lastTimestamp | grep -vi normal | tail -40 || true
