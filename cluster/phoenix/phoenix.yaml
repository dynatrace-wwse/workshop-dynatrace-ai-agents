# Phoenix (Arize) — LLM trace + eval UI for the workshop.
# Applied by cluster/install.sh into namespace `phoenix`.
#
# Phoenix is a TERMINAL OTLP backend: the OTel gateway fans traces out to it
# (see cluster/otel/collector-gateway.yaml). Attendees open the UI on the
# forwarded Codespace port 6006.
#
# Ports: 6006 = UI + OTLP/HTTP ingest, 4317 = OTLP/gRPC ingest.
# The Service is a NodePort: 6006 is pinned to nodePort 30606, which kind maps
# through to the forwarded Codespace port 6006 (see cluster/kind-config.yaml).
# 4317 stays cluster-internal (the OTel gateway reaches it in-cluster).
# Image + layout verified working against Phoenix OTLP ingest.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-data
  namespace: phoenix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # Empty storageClassName => the kind cluster default (standard / local-path).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: phoenix
  labels: { app: phoenix }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC — never two writers
  selector:
    matchLabels: { app: phoenix }
  template:
    metadata:
      labels: { app: phoenix }
    spec:
      securityContext:
        fsGroup: 1000            # let the non-root image write the PVC
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-20.19.0-nonroot
          imagePullPolicy: IfNotPresent
          env:
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            # >>> deepseek-provider  (installPhoenix drops this block when the
            # session has no LLM key — the in-cluster Ollama path)
            # DeepSeek preconfigured for the playground/evals (upstream ISI-6959):
            # attendees never hand-enter a key. Phoenix resolves Browser > DB
            # Secrets > Env, so an env default needs no PHOENIX_SECRET.
            # optional: true keeps Phoenix booting before the secret exists.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phoenix-deepseek
                  key: DEEPSEEK_API_KEY
                  optional: true
            # Restrict the playground model menu to the one approved provider.
            - name: PHOENIX_ALLOWED_PROVIDERS
              value: "DEEPSEEK"
            # Injected by envsubst in installPhoenix from WORKSHOP_LLM_BASE_URL:
            # DeepSeek direct by default, or the per-attendee model-proxy
            # endpoint when a room password dispensed one (ISI-6996).
            - name: DEEPSEEK_BASE_URL
              value: "${WORKSHOP_LLM_BASE_URL}"
            # <<< deepseek-provider
          ports:
            - { name: ui-http, containerPort: 6006 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /healthz, port: 6006 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 6006 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /mnt/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: phoenix-data
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: phoenix
  labels: { app: phoenix }
spec:
  type: NodePort
  selector: { app: phoenix }
  ports:
    - { name: ui-http, port: 6006, targetPort: 6006, nodePort: 30606 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
